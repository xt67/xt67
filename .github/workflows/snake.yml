name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: xt67
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=22D3EE
            dist/snake-light.svg?palette=github&color_snake=0891B2

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist

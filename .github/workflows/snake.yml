name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: xt67
          outputs: |
            dist/snake.svg?color_snake=#22D3EE&color_dots=#0B1220,#123A4A,#0E7490,#22D3EE,#A78BFA
            dist/snake-dark.svg?color_snake=#22D3EE&color_dots=#0B1220,#123A4A,#0E7490,#22D3EE,#A78BFA
            dist/snake-light.svg?color_snake=#0891B2&color_dots=#E2E8F0,#BAE6FD,#67E8F9,#0891B2,#7C3AED

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
